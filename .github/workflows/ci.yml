name: build-and-selftest

on:
  push:
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Build and selftest
        shell: pwsh
        run: .\build.ps1 -SelfTest
      - name: Check generated glyphs
        shell: pwsh
        run: python tools/generate_glyphs.py --check

  linux:
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libgl1-mesa-dev libx11-dev libxcursor-dev libxrandr-dev libxinerama-dev libxi-dev xvfb
      - name: Check generated glyphs
        run: python3 tools/generate_glyphs.py --check
      - name: Configure and build
        run: cmake -S . -B build-ci -DCMAKE_BUILD_TYPE=Release -DPIANO_FETCH_RAYLIB=ON
      - name: Build
        run: cmake --build build-ci --parallel
      - name: Selftest
        run: ./piano-cli --selftest
      - name: ThreadSanitizer configure and build
        if: matrix.os == 'ubuntu-22.04'
        run: cmake -S . -B build-tsan -DCMAKE_BUILD_TYPE=Debug -DPIANO_FETCH_RAYLIB=ON -DPIANO_TSAN=ON
      - name: ThreadSanitizer build
        if: matrix.os == 'ubuntu-22.04'
        run: cmake --build build-tsan --parallel

  macos:
    strategy:
      matrix:
        include:
          - runner: macos-13
            arch: x86_64
          - runner: macos-14
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Check generated glyphs
        run: python3 tools/generate_glyphs.py --check
      - name: Configure and build
        run: |
          cmake -S . -B build-ci -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0 \
            -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }} \
            -DPIANO_FETCH_RAYLIB=ON
          cmake --build build-ci --parallel
      - name: Selftest
        run: ./piano-cli --selftest
