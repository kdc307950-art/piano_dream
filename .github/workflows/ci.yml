name: build-and-selftest

on:
  push:
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Build and selftest
        shell: pwsh
        run: .\build.ps1 -SelfTest
      - name: Install NSIS
        shell: pwsh
        run: choco install nsis --version=3.13 --no-progress -y
      - name: Build NSIS installer
        shell: pwsh
        run: .\build.ps1 -Installer
      - name: Upload NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: GrandStudioPiano-windows-installer
          path: build/*-setup.exe
      - name: Check generated glyphs
        shell: pwsh
        run: python tools/generate_glyphs.py --check
      - name: Check English pseudo-localization budget
        shell: pwsh
        run: python tools/check_pseudo_localization.py

  linux:
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libgl1-mesa-dev libx11-dev libwayland-dev libxkbcommon-dev libxcursor-dev libxrandr-dev libxinerama-dev libxi-dev xvfb
      - name: Check generated glyphs
        run: python3 tools/generate_glyphs.py --check
      - name: Configure and build
        run: cmake -S . -B build-ci -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build-ci --parallel
      - name: Selftest
        run: ctest --test-dir build-ci --output-on-failure
      - name: ThreadSanitizer configure and build
        if: matrix.os == 'ubuntu-22.04'
        run: cmake -S . -B build-tsan -DCMAKE_BUILD_TYPE=Debug -DPIANO_TSAN=ON
      - name: ThreadSanitizer build
        if: matrix.os == 'ubuntu-22.04'
        run: cmake --build build-tsan --parallel
      - name: ThreadSanitizer selftest
        if: matrix.os == 'ubuntu-22.04'
        # TSan 构建不覆盖仓库根产物（CMakeLists 条件输出目录），二进制在 build-tsan/
        run: ./build-tsan/piano-cli --selftest
      - name: Screenshot matrix
        if: matrix.os == 'ubuntu-22.04'
        run: xvfb-run -a python3 tools/capture_matrix.py --exe ./piano --out artifacts/screenshots
      - name: Upload screenshots
        if: matrix.os == 'ubuntu-22.04'
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-ubuntu-22.04
          path: artifacts/screenshots/

  macos:
    strategy:
      matrix:
        include:
          # macos-13 已于 2025-12 退役（job 无限排队），x86_64 改用最后的 Intel runner
          - runner: macos-15-intel
            arch: x86_64
          - runner: macos-14
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Check generated glyphs
        run: python3 tools/generate_glyphs.py --check
      - name: Configure and build
        run: |
          cmake -S . -B build-ci -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0 \
            -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }}
          cmake --build build-ci --parallel
      - name: Selftest
        run: ./piano-cli --selftest
